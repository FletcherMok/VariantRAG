name: Validate VariantRAG
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: pip install pyyaml==6.0.3 requests==2.34.2
      - run: ruff check --config pyproject.toml backend/variantrag tests benchmarks
      - run: pytest -q --junitxml=results/tests.xml
      - run: PYTHONPATH=backend python -m variantrag.cli run --vcf tests/fixtures/demo.vcf --literature tests/fixtures/demo_literature.json --mode demo --out results/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: results/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  nextflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.04.6'
      - run: pip install -r requirements.lock
      - run: nextflow run backend/main.nf -profile demo --outdir results/nf
      - run: nextflow run backend/main.nf -profile demo --outdir results/nf -resume
      - run: nextflow run backend/main.nf --workflow rank --bundles results/nf/EvidenceBundle.json --outdir results/rank-only
