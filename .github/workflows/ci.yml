name: Validate VariantRAG
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.lock
      - run: ruff check --config pyproject.toml backend/variantrag tests benchmarks
      - run: pytest -q --junitxml=results/tests.xml
      - run: PYTHONPATH=backend python -m variantrag.cli run --vcf tests/fixtures/demo.vcf --literature tests/fixtures/demo_literature.json --mode demo --out results/demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation
          path: results/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  nextflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165 # v2
        with:
          version: '26.04.6'
      - run: pip install -r requirements-dev.lock
      - run: nextflow run backend/main.nf -profile demo --outdir results/nf
      - run: nextflow run backend/main.nf -profile demo --outdir results/nf -resume
      - run: nextflow run backend/main.nf --workflow rank --bundles results/nf/EvidenceBundle.json --outdir results/rank-only
