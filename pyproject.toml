[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "variantrag"
version = "0.2.0"
description = "Provenance-first variant evidence workbench"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["cyvcf2", "pysam", "duckdb", "pydantic>=2", "httpx", "scipy", "sqlglot", "fastapi", "uvicorn", "python-multipart", "defusedxml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
literature = ["docling", "transformers", "torch", "faiss-cpu", "defusedxml"]
grounding = ["genshi", "dateparser", "scikit-learn", "pandas", "pyyaml", "requests"]
normalization = ["mutalyzer==3.1.1"]

[project.scripts]
variantrag = "variantrag.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["variantrag*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI parameter declarations

[tool.setuptools.package-data]
variantrag = ["fixtures/*.vcf", "fixtures/*.json"]
