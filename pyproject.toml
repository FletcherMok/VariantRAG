[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "variantrag"
version = "0.2.0"
description = "Provenance-first variant evidence workbench"
requires-python = ">=3.11,<3.14"
dependencies = ["cyvcf2", "pysam", "duckdb", "pydantic>=2", "httpx", "scipy", "sqlglot", "fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
literature = ["docling", "transformers", "torch", "faiss-cpu", "defusedxml"]
grounding = ["mutalyzer==3.1.1", "mutalyzer-api==0.3.2", "setuptools<81", "genshi", "dateparser", "scikit-learn", "pandas", "pyyaml", "requests"]

[project.scripts]
variantrag = "variantrag.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["variantrag*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI parameter declarations
